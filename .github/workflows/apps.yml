name: apps

on:
  pull_request:
    paths: ["apps/**", "charts/**", "scripts/deploy.sh", ".github/workflows/apps.yml"]
  push:
    branches: [main]
    paths: ["apps/**", "charts/**", "scripts/deploy.sh", ".github/workflows/apps.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: apps-prod
  cancel-in-progress: false

env:
  REGISTRY: us-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/apps
  BACKUP_REGISTRY: us-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/apps-backup

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: lint + smoke test
        working-directory: apps
        env:
          ENABLE_TRACING: "false"
          ENABLE_PROFILER: "false"
          ENABLE_FIRESTORE: "false"
          GOOGLE_CLOUD_PROJECT: ci
          CLUSTER_NAME: ci
          CLUSTER_REGION: ci
        run: |
          pip install -q -r requirements.txt ruff
          ruff check .
          for app in app1 app2; do
            PYTHONPATH=.:$app python -c "
          import main
          c = main.app.test_client()
          assert c.get('/healthz').status_code == 200
          assert c.get('/$app/').status_code == 200
          assert c.get('/$app/error').status_code == 500
          assert c.get('/nope').status_code == 404
          print('$app OK')"
          done
      - name: lint and render Helm charts
        run: |
          for app in app1 app2; do
            image="us-docker.pkg.dev/ci/apps/$app:ci"
            helm lint charts/app \
              --set-string appName="$app" \
              --set-string projectID=ci \
              --set-string image="$image"
            helm template "$app" charts/app --namespace "$app" \
              --set-string appName="$app" \
              --set-string projectID=ci \
              --set-string image="$image" > /dev/null
          done
          helm lint charts/gateway
          helm template platform-gateway charts/gateway --namespace gateway-infra > /dev/null

  build-sign-deploy:
    needs: test
    # Also skip until bootstrap has set the repo variables
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPS_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin,kubectl,local-extract

      - name: docker login (Artifact Registry)
        run: gcloud auth configure-docker us-docker.pkg.dev,us-east1-docker.pkg.dev --quiet

      - name: build + push
        run: |
          for app in app1 app2; do
            docker build --build-arg APP=$app --build-arg VERSION=${GITHUB_SHA::7} \
              -t "$REGISTRY/$app:${GITHUB_SHA}" apps/
            docker push "$REGISTRY/$app:${GITHUB_SHA}"
            docker tag "$REGISTRY/$app:${GITHUB_SHA}" "$BACKUP_REGISTRY/$app:${GITHUB_SHA}"
            docker push "$BACKUP_REGISTRY/$app:${GITHUB_SHA}"
          done

      - name: vulnerability gate (on-demand scan, block CRITICAL)
        run: |
          for app in app1 app2; do
            scan=$(gcloud artifacts docker images scan "$REGISTRY/$app:${GITHUB_SHA}" \
                    --remote --format='value(response.scan)')
            if [ -z "$scan" ]; then echo "::error::$app scan did not return a scan resource"; exit 1; fi
            severities=$(gcloud artifacts docker images list-vulnerabilities "$scan" \
              --format='value(vulnerability.effectiveSeverity)')
            crit=$(printf '%s\n' "$severities" | grep -c '^CRITICAL$' || true)
            echo "$app CRITICAL vulnerabilities: $crit"
            if [ "$crit" -gt 0 ]; then echo "::error::$app has CRITICAL vulnerabilities"; exit 1; fi
          done

      - name: attest (Binary Authorization)
        run: |
          for app in app1 app2; do
            for registry in "$REGISTRY" "$BACKUP_REGISTRY"; do
              digest=$(gcloud artifacts docker images describe "$registry/$app:${GITHUB_SHA}" \
                        --format='value(image_summary.digest)')
              gcloud beta container binauthz attestations sign-and-create \
                --project="${{ vars.GCP_PROJECT_ID }}" \
                --artifact-url="$registry/$app@$digest" \
                --attestor="build-attestor" \
                --attestor-project="${{ vars.GCP_PROJECT_ID }}" \
                --keyversion-project="${{ vars.GCP_PROJECT_ID }}" \
                --keyversion-location="global" \
                --keyversion-keyring="binauthz-v1" \
                --keyversion-key="build-attestor" \
                --keyversion="1"
            done
          done

      - name: deploy to both clusters
        run: bash scripts/deploy.sh "${{ vars.GCP_PROJECT_ID }}" "${GITHUB_SHA}"
