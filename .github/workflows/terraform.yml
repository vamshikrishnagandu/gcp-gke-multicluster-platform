name: terraform

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write       # required to mint the GitHub OIDC token for Workload Identity Federation
  pull-requests: write  # post the plan as a PR comment

concurrency:
  group: terraform-prod # never run two applies against the same state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  WORKDIR: terraform/envs/prod

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - name: checkov (IaC security scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          config_file: .checkov.yaml

  plan-apply:
    needs: static-checks
    # Only main/prod jobs receive cloud credentials; PRs still run static checks.
    if: github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'prod' || '' }}
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - name: validate required Actions configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_TF_SA: ${{ vars.GCP_TF_SA }}
          GCP_APPS_SA: ${{ vars.GCP_APPS_SA }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          GATEWAY_IP: ${{ vars.GATEWAY_IP }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          missing=0
          for name in GCP_PROJECT_ID GCP_TF_SA GCP_APPS_SA TF_STATE_BUCKET GATEWAY_IP ALERT_EMAIL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Actions configuration is missing: $name"
              missing=1
            fi
          done
          exit "$missing"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: validate
        run: terraform validate

      - name: plan
        id: plan
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="ci_apps_sa=${{ vars.GCP_APPS_SA }}" \
            -var="spot_nodes=true" \
            -var="deletion_protection=false" \
            -var="binauthz_enforcement_mode=${{ vars.BINAUTHZ_MODE || 'ENFORCED_BLOCK_AND_AUDIT_LOG' }}" \
            -var="uptime_host=${{ vars.GATEWAY_IP }}" \
            -var="alert_email=${ALERT_EMAIL}" | tee plan.txt

      - name: reject destructive plans
        run: |
          set -o pipefail
          deletions=$(terraform show -json tfplan | jq '[.resource_changes[]? | select(.change.actions | contains(["delete"]))] | length')
          if [[ "$deletions" -gt 0 ]]; then
            echo "::error::Refusing to auto-apply a plan with $deletions deletion(s)"
            exit 1
          fi

      - name: comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKDIR }}/plan.txt', 'utf8');
            const body = '### Terraform plan\n```\n' + plan.slice(-60000) + '\n```';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan
