apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  labels:
    app: app1
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: app1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # zero-downtime: never remove a pod before its replacement is Ready
  template:
    metadata:
      labels:
        app: app1
    spec:
      serviceAccountName: app1
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across zones AND nodes -> a zone outage keeps 2/3 serving
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app1
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app1
      containers:
        - name: app1
          image: IMAGE_APP1
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: app1
            - name: TRACE_SAMPLE_RATIO
              value: "0.2"
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi # memory limit only: CPU limits cause throttling, HPA handles CPU
          readinessProbe:
            httpGet:
              path: /app1/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              # give the LB time to stop sending traffic before the process exits
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
