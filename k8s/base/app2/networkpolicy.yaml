apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app2-ingress
spec:
  podSelector:
    matchLabels:
      app: app2
  policyTypes: ["Ingress"]
  ingress:
    # Only the Google LB / health checkers - app2 is the public entry point
    - from:
        - ipBlock: {cidr: 35.191.0.0/16}
        - ipBlock: {cidr: 130.211.0.0/22}
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - port: 8080
