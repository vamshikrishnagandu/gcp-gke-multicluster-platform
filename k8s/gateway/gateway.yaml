apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: gateway-infra
spec:
  # "-mc" = multi-cluster. Global external Application LB (Envoy-based, anycast IP).
  # Default traffic distribution: each user goes to the CLOSEST healthy region;
  # when a region fills up or fails, traffic spills over to the other one.
  gatewayClassName: gke-l7-global-external-managed-mc
  addresses:
    - type: NamedAddress
      value: platform-gateway-ip # reserved by Terraform (google_compute_global_address.gateway)
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: platform
