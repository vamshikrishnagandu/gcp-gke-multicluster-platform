# --- Health checks: LB default is GET / which our apps answer with 404 -> all
#     backends "unhealthy". Point the LB at each app's real health endpoint.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: app1
  namespace: app1
spec:
  default:
    checkIntervalSec: 5
    timeoutSec: 3
    healthyThreshold: 2
    unhealthyThreshold: 2
    logConfig:
      enabled: true
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /app1/healthz
  targetRef:
    group: net.gke.io
    kind: ServiceImport
    name: app1
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: app2
  namespace: app2
spec:
  default:
    checkIntervalSec: 5
    timeoutSec: 3
    healthyThreshold: 2
    unhealthyThreshold: 2
    logConfig:
      enabled: true
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /app2/healthz
  targetRef:
    group: net.gke.io
    kind: ServiceImport
    name: app2
---
# --- Backend policy: Cloud Armor WAF + 100% LB request logging (feeds BigQuery lb_logs sink)
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: app1
  namespace: app1
spec:
  default:
    securityPolicy: edge-waf
    timeoutSec: 30
    logging:
      enabled: true
      sampleRate: 1000000 # 1,000,000 = 100%
    connectionDraining:
      drainingTimeoutSec: 20
  targetRef:
    group: net.gke.io
    kind: ServiceImport
    name: app1
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: app2
  namespace: app2
spec:
  default:
    securityPolicy: edge-waf
    timeoutSec: 30
    logging:
      enabled: true
      sampleRate: 1000000
    connectionDraining:
      drainingTimeoutSec: 20
  targetRef:
    group: net.gke.io
    kind: ServiceImport
    name: app2
