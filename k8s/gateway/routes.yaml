# Each app owns its route in its own namespace (team autonomy).
# backendRef = ServiceImport (fleet-wide service), NOT Service (single cluster).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app1
  namespace: app1
spec:
  parentRefs:
    - name: platform
      namespace: gateway-infra
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /app1
      backendRefs:
        - group: net.gke.io
          kind: ServiceImport
          name: app1
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
