apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gatewayName }}
  namespace: gateway-infra
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  addresses:
    - type: NamedAddress
      value: {{ .Values.addressName }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: platform