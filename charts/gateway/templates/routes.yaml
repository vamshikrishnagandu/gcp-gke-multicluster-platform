{{- range .Values.apps }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ . }}
  namespace: {{ . }}
  labels:
    app.kubernetes.io/part-of: platform
spec:
  parentRefs:
    - name: {{ $.Values.gatewayName }}
      namespace: gateway-infra
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /{{ . }}
      backendRefs:
        - group: net.gke.io
          kind: ServiceImport
          name: {{ . }}
          port: 8080
---
{{- end }}