apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.appName }}
  labels:
    app.kubernetes.io/part-of: platform
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .Values.appName }}-ingress
  namespace: {{ .Values.appName }}
  labels:
    app.kubernetes.io/part-of: platform
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.appName }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - port: 8080
    {{- if eq .Values.appName "app1" }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app2
        - ipBlock:
            cidr: 10.20.0.0/14
      ports:
        - port: 8080
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - port: 8080