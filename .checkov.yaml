# Accepted risks - every skip has a reason (reviewed by SecOps, see docs/secops/security-design.md)
compact: true
quiet: true
skip-check:
  - CKV_GCP_84  # Artifact Registry CMEK: Google-managed encryption accepted for this demo
  - CKV_GCP_83  # Secret Manager CMEK: same
  - CKV_GCP_81  # Redis CMEK: same
  - CKV_GCP_6   # Cloud SQL "require SSL" legacy check - ssl_mode=ENCRYPTED_ONLY is used instead
  - CKV_GCP_79  # Cloud SQL latest major version: PG16 pinned deliberately
  - CKV_GCP_65  # GKE Google Groups RBAC: personal account has no Workspace groups
  - CKV_GCP_66  # GKE Binary Authorization legacy field: we use evaluation_mode (newer API)
  - CKV_GCP_13  # GKE client cert: disabled by default on modern GKE, field deprecated
  - CKV_GCP_24  # PodSecurityPolicy: removed in k8s 1.25, replaced by Pod Security Admission
  - CKV_GCP_69  # GKE metadata server: set on node pool (workload_metadata_config), check looks at cluster
  - CKV_GCP_68  # Secure boot: set on node pool shielded_instance_config
  - CKV_GCP_22  # COS image: set on node pool
  - CKV_GCP_62  # State bucket access logs: audit logs used instead
  - CKV_GCP_78  # State bucket versioning: enabled (false positive on older checkov)
  - CKV2_GCP_18 # VPC firewall "allow all internal": scoped to our own node/pod CIDRs only
  # --- added after first CI run (M14) ---
  - CKV_GCP_12  # GKE network_policy block: Dataplane V2 (ADVANCED_DATAPATH) enforces NetworkPolicy natively; the legacy Calico field must stay unset
  - CKV_GCP_57  # log_min_duration_statement=-1: we deliberately log slow queries > 500 ms
  - CKV2_GCP_13 # log_duration=on for every statement: too noisy/costly; slow-query log covers it
  - CKV_GCP_82  # KMS prevent_destroy: off so the demo can be torn down (key ring name is versioned)
  - CKV_GCP_42  # MCI controller needs roles/container.admin (Google-documented requirement for multi-cluster Gateway)
  - CKV_GCP_117 # ci-terraform roles/editor: accepted risk, see docs/secops/security-design.md "CI identities"
  - CKV_GCP_49  # ci-terraform manages SAs: required to create workload/node SAs; same accepted risk
  - CKV2_GCP_5  # Data Access audit logs on all services: cost; Admin Activity audit logs are always on
